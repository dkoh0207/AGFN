finetuning:
  type: 'rtb'
  wandb_project_name: "GFN_Finetune"
  task: "QedxSaxDock"
  # BBB gate (predict_proba already in [0,1] -> clamp at the threshold)
  bbb_constraint: true
  bbb_model_path: "./saved_models/autogluon/bbb_maccs_descriptors"
  bbb_mode: "clamp"         # clamp | hard | soft
  bbb_threshold: 0.9        # clamp ceiling (and hard-mode step threshold)
  bbb_fail_reward: 1.e-30
  bbb_positive_class: 1
  # Solubility gate (raw LogS -> soft smoothstep over [sol_low, sol_high]; higher = better)
  sol_constraint: true
  sol_model_path: "./saved_models/autogluon/solubility_autogluon"
  sol_mode: "soft"          # soft | hard | clamp
  sol_low: -6.0             # LogS at/below which the factor is 0
  sol_high: -4.0            # LogS at/above which the factor is 1
  sol_threshold: -4.0       # used only when sol_mode is hard/clamp
  sol_fail_reward: 1.e-30
  # ChEMBL ring-system rarity gate: floor reward for molecules whose rarest ring system
  # appears < chembl_ring_min_count times in ChEMBL (useful_rdkit_utils.RingSystemLookup).
  chembl_ring_constraint: true
  chembl_ring_mode: "hard"         # hard | soft | clamp
  chembl_ring_min_count: 5         # min ChEMBL ring-system frequency to pass (hard threshold)
  chembl_ring_fail_reward: 1.e-30
  # chembl_ring_low: 1             # (soft mode only) frequency at/below which the factor is 0
  # chembl_ring_high: 5           # (soft mode only) frequency at/above which the factor is 1
  chembl_ring_ignore_stereo: false
  chembl_ring_db_path: !!null      # null -> useful_rdkit_utils default cached chembl_ring_systems.csv
  task_possible_range: [-20,0]
  target_name: "lrrk2" #"braf" #"fa7" #"parp1" # "jak2" #
  unidock_search_mode: "fast"  # fast | balance | detail
  unidock_num_workers: 1       # >1 enables a multiprocessing pool for ETKDG conformer gen
  gfn_samples_path: "./data/gfn_samples"
  saved_model_path: "./saved_models/pretrained/decent-butterfly-1_110000.pt"
  target_grid:
    lrrk2:
      receptor: "./data/docking/lrrk2.pdbqt"
      center_x: 185.7
      center_y: 178.1
      center_z: 144.7
      size_x: 22.032
      size_y: 22.032
      size_z: 22.032
  vargrad: True
  write_mols_to_disk: True
  layerwise_lr: True
  perturb_logZ: true
  atoms: ['Br', 'C', 'Cl', 'F', 'I', 'N', 'O', 'S']
  log_dir: '/home/aid/dkoh/log/generative/BBB'
  diversity_filter: True
  offline_data: False
  offline_df_path: "./data/finetune_offline_data.csv"
  gfn_loss_coeff: 1 #0.04
  MLE_coeff: 0 #20
  num_iter: 500000000000
  load_saved_model: True
  bootstrap_own_reward: False
  random_seed: 1428570
  reset_wts: False
  reset_logZ: False
  freeze_model: False
  replay: False
  beta_exp: 96 #32 #8 # 64
  OOB_percent: 0.1
  zinc_rad_scale: !!null
  reward_aggergation: "mul"
  atomenv_dictionary: "./data/atomenv_counts_ZINC_radius2_763K.pkl"
  sampling_batch_size: 64 #512 #1024 #512
  training_batch_size: 16 #64 #64 #128 #64
  learning_rate: 1.e-7
  num_workers: 1 #2 #4 # 8
  num_emb: 128
  num_layers: 15
  num_mlp_layers:  10
  num_heads: 4
  i2h_width: 1
  tb_epsilon: !!null
  tb_do_subtb: False
  illegal_action_logreward: -512
  weight_decay: 1.e-8
  momentum: 0.9
  adam_eps: 1.e-8
  lr_decay: 20000
  Z_lr_decay: 20000
  clip_grad: False
  clip_grad_type: "norm"
  clip_grad_param: 10
  random_action_prob: 0.001
  random_stop_prob: 0.001
  sampling_tau: 0.0
  num_back_steps_max: 25
  max_traj_len: 40
  max_nodes: 45
  max_edges: 50
  tb_p_b_is_parameterized: True
  num_thermometer_dim: 16
  sample_temp: 1
  checkpoint_every: 1000       # how often (iters) to save the model state .pt
  top_k_save_every: 100        # how often (iters) to flush the top-K hall of fame; also flushed once at run end
  